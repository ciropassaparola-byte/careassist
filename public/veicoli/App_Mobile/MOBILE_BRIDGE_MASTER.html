<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="assets/js/hta_polyfills.js"></script>
    <title>Mobile Bridge Master Gold - Platinum Edition</title>
    <HTA:APPLICATION 
        APPLICATIONNAME="MobileBridgeMaster"
        ID="MobileBridgeMaster"
        BORDER="thin"
        ICON="..\assets\img\app_icon_premium.ico"
        SCROLL="no"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="normal"

        CAPTION="yes"

    <style>
        :root {
            --gold-light: #ffe066;
            --gold: #d4af37;
            --gold-rich: #f59e0b;
            --gold-dark: #b45309;
            --bg-deep: #0a0e1a;
            --panel: rgba(30, 41, 59, 0.6);
            --glow-green: #10b981;
            --glow-cyan: #38bdf8;
            --glow-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; user-select: none; cursor: default; }
        
        body { 
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%, #0a0e1a 100%);
            background-attachment: fixed;
            color: #f8fafc;
            margin: 0; padding: 16px;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%;
            max-width: 480px;
            margin: 10px auto;
            padding: 22px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 2; 
        }
        
        /* Header Section */
        .header { 
            text-align: center; 
            padding-bottom: 12px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.05), transparent);
            border-radius: 12px;
        }
        h1 { 
            font-size: 21px; margin: 0; 
            font-weight: 900;
            color: #ffe066; 
            text-transform: uppercase; letter-spacing: 3px; 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            font-weight: 800;
            margin-top: 4px;
        }
        .signature {
            font-size: 9.5px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            margin-top: 2px;
            font-weight: 700;
        }

        /* Status Grid */
        .status-grid {
            display: flex; gap: 12px;
        }
        .status-box {
            flex: 1; background: rgba(30, 41, 59, 0.65); 
            border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            padding: 14px 16px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .label-mini { font-size: 9.5px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 800; }
        
        .indicator {
            width: 14px; height: 14px; border-radius: 50%;
            margin-bottom: 8px;
            transition: all 0.4s ease;
        }
        
        /* States */
        .status-off .indicator { background: #ef4444; box-shadow: 0 0 12px #ef4444; }
        .status-off span { color: #f87171; font-weight: bold; }
        
        .status-wait .indicator { 
            background: #f59e0b; 
            box-shadow: 0 0 14px #f59e0b;
            animation: pulseWait 1.5s infinite ease-in-out;
        }
        .status-wait span { color: #ffe066; font-weight: bold; }

        .status-on .indicator { 
            background: #10b981; 
            box-shadow: 0 0 16px #10b981, 0 0 30px rgba(16,185,129,0.5); 
            animation: pulseGlow 2s infinite ease-in-out;
        }
        .status-on span { color: #34d399; font-weight: 900; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(52,211,153,0.5); }
        
        @keyframes pulseGlow {
            0% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 20px #10b981; }
            100% { opacity: 0.7; transform: scale(0.95); }
        }
        @keyframes pulseWait {
            0%, 100% { transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        /* URL Display box */
        .url-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px; padding: 14px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 20px rgba(56, 189, 248, 0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .url-title { font-size: 10.5px; color: #38bdf8; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1.5px; }
        .url-link {
            font-family: 'Consolas', 'Courier New', monospace;
            color: #38bdf8; font-size: 15px;
            font-weight: 900; text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            word-break: break-all; line-height: 1.4;
        }

        /* QR Code Area - LUXURY CARD */
        .qr-stage {
            flex-grow: 1;
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            border: 1.5px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 25px rgba(212,175,55,0.05);
            position: relative;
            min-height: 220px;
        }

        #qrcode {
            background: #ffffff;
            padding: 16px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7), 0 0 25px rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #qrcode img, #qrcode canvas {
            display: block;
            border-radius: 8px;
        }
        
        /* Log Area */
        .console-log {
            height: 44px; background: rgba(10, 15, 26, 0.95); border-radius: 10px;
            padding: 8px 12px; font-family: 'Consolas', monospace;
            font-size: 10px; color: rgba(56, 189, 248, 0.7);
            overflow-y: auto; border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        
        /* Footer Buttons */
        .footer-actions { display: flex; gap: 12px; }
        .btn-lux {
            flex: 1; padding: 14px; border: none; border-radius: 12px;
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            transition: all 0.25s ease; cursor: pointer; letter-spacing: 0.5px;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #f59e0b);
            color: #0b0f19; box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
        }
        .btn-gold:hover { background: linear-gradient(135deg, #ffe066, #d4af37); transform: translateY(-2px); box-shadow: 0 6px 22px rgba(212, 175, 55, 0.5); }
        
        .btn-dark {
            background: rgba(30, 41, 59, 0.8); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        .btn-dark:hover { background: rgba(51, 65, 85, 0.9); color: #ffe066; border-color: rgba(212, 175, 55, 0.4); transform: translateY(-2px); }
        
        /* Connection Toggle Mode style */
        .toggle-mode {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 14px;
            padding: 4px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 4px;
            backdrop-filter: blur(10px);
        }
        .btn-toggle {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-toggle:hover {
            color: #ffe066;
        }
        .btn-toggle.active {
            background: linear-gradient(135deg, #d4af37, #f59e0b);
            color: #0b0f19;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>

    <script>
        var shell = null;
        var fso = null;
        try { shell = new ActiveXObject("WScript.Shell"); } catch(e) {}
        try { fso = new ActiveXObject("Scripting.FileSystemObject"); } catch(e) {}
        var appPath = "";
        var checkInterval = null;
        var currentUrl = "";
        var nodeExe = "node";
        var connectionMode = "tunnel";
        var localIP = "";

        function detectLocalIP() {
            try {
                if (typeof GetObject !== "undefined") {
                    var wmi = GetObject("winmgmts:\\\\.\\root\\cimv2");
                    var colItems = wmi.ExecQuery("Select IPAddress from Win32_NetworkAdapterConfiguration where IPEnabled=True");
                    var enumItems = new Enumerator(colItems);
                    var foundIPs = [];
                    for (; !enumItems.atEnd(); enumItems.moveNext()) {
                        var item = enumItems.item();
                        if (item.IPAddress !== null && typeof item.IPAddress !== "undefined") {
                            var desc = (item.Description || "").toLowerCase();
                            var isVirtual = desc.indexOf("virtual") > -1 || desc.indexOf("vmware") > -1 || desc.indexOf("virtualbox") > -1 || desc.indexOf("tap") > -1 || desc.indexOf("vpn") > -1;
                            
                            var ips = item.IPAddress.toArray();
                            for (var i = 0; i < ips.length; i++) {
                                var ip = ips[i];
                                if (ip.indexOf(".") > -1 && ip.indexOf("127.0.0.") !== 0) {
                                    foundIPs.push({ ip: ip, isVirtual: isVirtual });
                                }
                            }
                        }
                    }
                    foundIPs.sort(function(a, b) { return a.isVirtual - b.isVirtual; });
                    if (foundIPs.length > 0) return foundIPs[0].ip;
                }
            } catch(e) {}
            return "192.168.1.105";
        }

        function switchConnectionMode(mode) {
            if (connectionMode === mode) return;
            connectionMode = mode;
            currentUrl = "";
            document.getElementById("qrcode").innerHTML = "";
            document.getElementById("url-display").innerText = "Cambio modalità...";
            
            var btnTunnel = document.getElementById("btn-mode-tunnel");
            var btnLan = document.getElementById("btn-mode-lan");
            var tunCont = document.getElementById("tun-cont");
            var tunLbl = document.getElementById("tun-lbl");
            
            if (mode === "lan") {
                btnTunnel.className = "btn-toggle";
                btnLan.className = "btn-toggle active";
                log("Passaggio a rete locale (LAN Wi-Fi).");
            } else {
                btnTunnel.className = "btn-toggle active";
                btnLan.className = "btn-toggle";
                tunCont.className = "status-box status-wait";
                tunLbl.innerText = "AVVIO...";
                log("Passaggio a Cloud Tunnel (Internet).");
            }
            monitorLoop();
        }

        function init() {
            try { window.resizeTo(420, 720); } catch(e) {}
            try { window.moveTo((screen.width - 420)/2, (screen.height - 720)/2); } catch(e) {}
            
            try {
                if (fso) {
                    var path = window.location.pathname;
                    path = path.substring(1).replace(/\//g, "\\");
                    appPath = fso.GetParentFolderName(decodeURIComponent(path));
                }
            } catch(e) {}
            
            checkNode();
        }

        function log(msg) {
            var div = document.getElementById("mini-log");
            if (!div) return;
            var time = new Date().toLocaleTimeString();
            div.innerHTML = "<div>[" + time + "] " + msg + "</div>" + div.innerHTML;
        }

        function checkNode() {
            var portableNode = appPath ? (appPath + "\\bin\\node.exe") : "";
            if (fso && fso.FileExists(portableNode)) {
                nodeExe = "\"" + portableNode + "\"";
                log("Node portatile agganciato.");
                startEverything();
            } else if (shell) {
                try {
                    shell.Run("node -v", 0, true);
                    nodeExe = "node";
                    log("Node di sistema agganciato.");
                    startEverything();
                } catch(e) {
                    log("Avvio del server mobile...");
                    startEverything();
                }
            } else {
                log("Modulo Ponte Mobile pronto.");
                startEverything();
            }
        }

        function showSetupUI() {
            document.getElementById("serv-cont").className = "status-box status-off";
            document.getElementById("url-display").innerHTML = "ATTESA PREPARAZIONE SISTEMA";
            document.getElementById("qrcode").innerHTML = "<button class='btn-lux btn-gold' style='height:60px;' onclick='downloadNode()'>INSTALLA MOTORE ⚡</button>";
        }

        function downloadNode() {
            document.getElementById("qrcode").innerHTML = "<div style='color:#cc8800; text-align:center; font-weight:bold; font-family:sans-serif; font-size:14px;'>DOWNLOAD IN CORSO...<br><span style='font-size:11px; font-weight:normal; color:#666'>Attendere circa 60 secondi.</span></div>";
            log("Scaricamento Node.exe in background...");
            
            if (fso && shell) {
                var binDir = appPath + "\\bin";
                if (!fso.FolderExists(binDir)) fso.CreateFolder(binDir);
                
                var psCmd = "powershell -Command \"[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; $url='https://nodejs.org/dist/v22.11.0/win-x64/node.exe'; $out='" + binDir + "\\node.exe'; Invoke-WebRequest -Uri $url -OutFile $out\"";
                
                try {
                    shell.Run(psCmd, 0, true);
                    log("Motore scaricato con successo.");
                    checkNode();
                } catch(e) {
                    alert("Errore Download. Verifica Internet.\n" + e.message);
                    showSetupUI();
                }
            } else {
                startEverything();
            }
        }

        function killExisting() {
            if (shell) {
                try { shell.Run("taskkill /f /im node.exe", 0, true); } catch(e) {}
                try { shell.Run("taskkill /f /im cloudflared.exe", 0, true); } catch(e) {}
            }
        }

        function startEverything() {
            killExisting();
            currentUrl = "";
            document.getElementById("url-display").innerText = "Inizializzazione sottosistemi...";
            document.getElementById("serv-cont").className = "status-box status-on";
            document.getElementById("serv-lbl").innerText = "ONLINE";
            document.getElementById("tun-cont").className = "status-box status-wait";
            document.getElementById("tun-lbl").innerText = "ATTESA TUNNEL";
            document.getElementById("qrcode").innerHTML = '<div style="color:#38bdf8; font-size:12px; font-weight:800; font-family:sans-serif; text-align:center; padding:15px;">🔄 Generazione nuovo link e QR Code...</div>';

            try {
                var sh = (typeof shell !== "undefined" && shell) ? shell : (typeof ActiveXObject !== "undefined" ? new ActiveXObject("WScript.Shell") : null);
                if (sh) {
                    var startBat = "C:\\Users\\Utente\\Desktop\\LOGISTICA_CONSEGNE_MC\\questa\\Sistema_Logistica_C_Milella\\File_Sistema\\App_Mobile\\start_app.bat";
                    if (typeof fso !== "undefined" && fso && typeof appPath !== "undefined" && appPath) {
                        var checkBat = fso.BuildPath(appPath, "start_app.bat");
                        if (fso.FileExists(checkBat)) startBat = checkBat;
                    }
                    sh.Run('cmd.exe /c "' + startBat + '"', 0, false);
                    log("Avvio del Ponte Mobile in corso...");
                }
            } catch(e) {}
            
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(monitorLoop, 2000);
            setTimeout(monitorLoop, 2500);
        }

        function monitorLoop() {
            document.getElementById("serv-cont").className = "status-box status-on";
            document.getElementById("serv-lbl").innerText = "ONLINE";

            var ip = detectLocalIP();
            var lanUrl = "http://" + ip + ":3002";

            if (connectionMode === "lan") {
                if (currentUrl !== lanUrl) {
                    currentUrl = lanUrl;
                    document.getElementById("url-display").innerText = currentUrl;
                    document.getElementById("tun-cont").className = "status-box status-on";
                    document.getElementById("tun-lbl").innerText = "WI-FI ATTIVO";
                    log("IP Locale agganciato: " + currentUrl);
                    generateQR(currentUrl);
                }
                return;
            }

            var logPath = appPath ? (appPath + "\\tunnel_log.txt") : "";
            var tunnelFound = false;
            var txt = "";
            if (fso && logPath && fso.FileExists(logPath)) {
                try {
                    var f = fso.OpenTextFile(logPath, 1);
                    if (!f.AtEndOfStream) txt = f.ReadAll();
                    f.Close();
                } catch(e) {}
            }

            if (!txt) {
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open("GET", "tunnel_log.txt?t=" + new Date().getTime(), false);
                    xhr.send(null);
                    if (xhr.status === 200 || xhr.status === 0) {
                        txt = xhr.responseText;
                    }
                } catch(e) {}
            }

            if (txt) {
                txt = txt.replace(/\0/g, '').replace(/\r/g, '\n');
                var m = txt.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
                if (m && m[0]) {
                    var foundUrl = m[0].trim();
                    if (currentUrl !== foundUrl) {
                        currentUrl = foundUrl;
                        document.getElementById("url-display").innerText = currentUrl;
                        document.getElementById("tun-cont").className = "status-box status-on";
                        document.getElementById("tun-lbl").innerText = "TUNNEL ONLINE";
                        log("URL Cloud Tunnel (5G/4G) agganciato: " + currentUrl);
                        generateQR(currentUrl);
                    }
                    tunnelFound = true;
                }
            }

            if (!tunnelFound) {
                if (currentUrl !== lanUrl) {
                    currentUrl = lanUrl;
                    document.getElementById("url-display").innerText = currentUrl;
                    document.getElementById("tun-cont").className = "status-box status-on";
                    document.getElementById("tun-lbl").innerText = "PONTE ATTIVO";
                    log("Aggancio Ponte Mobile: " + currentUrl);
                    generateQR(currentUrl);
                }
            }
        }

        // Avvio automatico all'allineamento DOM
        if (document.readyState === "complete" || document.readyState === "interactive") {
            setTimeout(init, 100);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }

        function killExisting() {
            try {
                shell.Run("taskkill /f /im node.exe", 0, true);
                shell.Run("taskkill /f /im cloudflared.exe", 0, true);
            } catch(e) {}
            log("Clean-up dei processi.");
        }

        function copyUrl() {
            if (!currentUrl) return;
            window.clipboardData.setData("Text", currentUrl);
            alert("Link Cloudflare copiato in memoria!");
        }

        function showPremiumConfirm(title, text, callbackOk) {
            document.getElementById("premiumModalTitle").innerText = title;
            document.getElementById("premiumModalText").innerHTML = text;
            document.getElementById("premiumModalOverlay").style.display = "flex";
            
            var btnOk = document.getElementById("premiumModalBtnOk");
            var btnCancel = document.getElementById("premiumModalBtnCancel");
            
            // Rimuovi event listener precedenti (IE compatibile)
            var newBtnOk = btnOk.cloneNode(true);
            btnOk.parentNode.replaceChild(newBtnOk, btnOk);
            var newBtnCancel = btnCancel.cloneNode(true);
            btnCancel.parentNode.replaceChild(newBtnCancel, btnCancel);
            
            newBtnCancel.onclick = function() {
                document.getElementById("premiumModalOverlay").style.display = "none";
            };
            
            newBtnOk.onclick = function() {
                document.getElementById("premiumModalOverlay").style.display = "none";
                if(callbackOk) callbackOk();
            };
        }

        function doRestart() {
            showPremiumConfirm("RIAVVIO FORZATO", "Confermi il riavvio forzato del ponte mobile?", function() {
                currentUrl = "";
                document.getElementById("url-display").innerText = "Ricostruzione collegamento...";
                document.getElementById("qrcode").innerHTML = "";
                startEverything();
            });
        }

        function closeApp() {
            showPremiumConfirm("SCOLLEGAMENTO", "Scollegare il ponte mobile?<br><span style='color:#ff3355; font-weight:bold;'>I cellulari smetteranno di funzionare.</span>", function() {
                killExisting();
                window.close();
            });
        }

        function generateQR(url) {
            var area = document.getElementById("qrcode");
            area.innerHTML = "";
            try {
                new QRCode(area, {
                    text: url,
                    width: 190,
                    height: 190,
                    colorDark : "#111111",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } catch(e) {
                area.innerHTML = "Errore Render QR.";
            }

}
</script>

<body onload="init()" onbeforeunload="killExisting()">
    <div class="container">
        <!-- Intestazione -->
        <div class="header">
            <h1>MOBILE BRIDGE MASTER</h1>
            <div class="subtitle">GOLD PLATINUM EDITION</div>
            <div class="signature">by C. MILELLA</div>
        </div>

        <!-- Selettore Connessione -->
        <div class="toggle-mode">
            <button id="btn-mode-tunnel" class="btn-toggle active" onclick="switchConnectionMode('tunnel')">Tunnel Cloud</button>
            <button id="btn-mode-lan" class="btn-toggle" onclick="switchConnectionMode('lan')">Rete Locale (LAN Wi-Fi)</button>
        </div>

        <!-- Grid degli indicatori -->
        <div class="status-grid">
            <div id="serv-cont" class="status-box status-off">
                <div class="label-mini">SERVER NUCLEO</div>
                <div class="indicator"></div>
                <span id="serv-lbl">OFFLINE</span>
            </div>
            <div id="tun-cont" class="status-box status-off">
                <div class="label-mini">TUNNEL CLOUD</div>
                <div class="indicator"></div>
                <span id="tun-lbl">OFFLINE</span>
            </div>
        </div>

        <!-- Pannello URL -->
        <div class="url-panel">
            <div class="url-title">INDIRIZZO AGGANCIO MOBILE</div>
            <div id="url-display" class="url-link">RICERCA INDIRIZZO...</div>
        </div>

        <!-- QR Code Stage -->
        <div class="qr-stage">
            <div id="qrcode">
                <span style="color: #bbb; font-size: 11px; font-family:sans-serif;">Attesa link...</span>
            </div>
        </div>

        <!-- Console Log compatto -->
        <div id="mini-log" class="console-log"></div>

        <!-- Pulsantiera Premium -->
        <div class="footer-actions">
            <button class="btn-lux btn-dark" onclick="copyUrl()">COPIA</button>
            <button class="btn-lux btn-gold" onclick="doRestart()">RIAVVIA</button>
            <button class="btn-lux btn-dark" onclick="closeApp()">ESCI</button>
        </div>
        <!-- Premium Confirm Modal -->
        <div id="premiumModalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center;">
            <div style="background:linear-gradient(145deg, #1a1a20, #0d0d12); border:1px solid #ffc107; border-radius:18px; padding:30px; width:340px; text-align:center; box-shadow:0 15px 40px rgba(0,0,0,0.8); animation:modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
                <div style="width:64px; height:64px; border-radius:50%; background:rgba(255,193,7,0.08); border:2px solid #ffc107; color:#ffc107; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; margin:0 auto 20px; box-shadow:0 0 20px rgba(255,193,7,0.2);">?</div>
                <h2 id="premiumModalTitle" style="color:#ffc107; margin:0 0 12px; font-size:18px; font-weight:900; letter-spacing:1px;">CONFERMA</h2>
                <p id="premiumModalText" style="color:#d1d5db; font-size:13px; line-height:1.5; margin-bottom:25px; font-weight:600;">Sei sicuro?</p>
                <div style="display:flex; gap:12px;">
                    <button id="premiumModalBtnCancel" class="btn-lux btn-dark" style="flex:1; padding:12px;">ANNULLA</button>
                    <button id="premiumModalBtnOk" class="btn-lux btn-gold" style="flex:1; padding:12px;">OK</button>
                </div>
            </div>
        </div>
        <style>
            @keyframes modalPop {
                0% { transform: scale(0.7); opacity: 0; }
                100% { transform: scale(1); opacity: 1; }
            }
        </style>
    </div>
<script src="../assets/js/hacker_mode.js"></script>

<script src="../assets/js/global_context.js"></script>
</body>
</html>
